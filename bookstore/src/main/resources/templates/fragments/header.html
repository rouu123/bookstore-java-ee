<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<header class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/books}" th:text="#{books.title}">Bookstore</a>

        <div class="d-flex align-items-center ms-auto">

            <!-- Language Switcher -->
            <form method="get" th:action="@{__${#httpServletRequest.requestURI}__}" class="me-3">
                <input type="hidden" name="lang" value="en">
                <button class="btn btn-outline-secondary btn-sm me-1" type="submit">🇬🇧</button>
            </form>
            <form method="get" th:action="@{__${#httpServletRequest.requestURI}__}" class="me-3">
                <input type="hidden" name="lang" value="fr">
                <button class="btn btn-outline-secondary btn-sm" type="submit">🇫🇷</button>
            </form>

            <!-- Book List -->
            <a class="btn btn-outline-primary me-2" th:href="@{/books}" th:text="#{books.list}">Book List</a>

            <!-- Cart -->
            <a class="btn btn-outline-success" th:href="@{/cart}" th:text="#{cart.button}">Cart</a>
        </div>
    </div>
</header>
</body>
</html>
