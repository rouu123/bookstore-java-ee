<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{books.title}">Books</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h2 th:text="#{books.list}">Book List</h2>
    <div class="row">
        <div class="col-md-4" th:each="book : ${books}">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.title}">Book Title</h5>
                    <p class="card-text" th:text="${book.author}">Author Name</p>
                    <p class="card-text"><strong th:text="${book.price} + ' $'">10.00 $</strong></p>
                    <a th:href="@{'/books/' + ${book.id}}" class="btn btn-primary" th:text="#{books.details}">Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
